// Use a new directory name for each manual acceptance run; existing worlds are never deleted.
// ./gradlew runGameTestServer -I tools/r21-gametest.gradle -PterrainAuditWorld=run-r21-check-01 --offline
allprojects {
    afterEvaluate {
        def forge = extensions.findByName('neoForge')
        if (forge != null) {
            forge.runs.gameTestServer.gameDirectory = file(
                providers.gradleProperty('terrainAuditWorld').getOrElse('run-r21-gametest'))
        }
    }
}
