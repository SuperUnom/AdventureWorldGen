// Use a new -PterrainAuditWorld directory to measure fresh planning rather than a READY cache hit.
allprojects {
 afterEvaluate {
  def forge = extensions.findByName('neoForge')
  if (forge != null) {
   forge.runs.gameTestServer.gameDirectory = file(providers.gradleProperty('terrainAuditWorld').getOrElse('run-r24-planning'))
   forge.runs.gameTestServer.systemProperty 'neoforge.enabledGameTestNamespaces', 'testcompanion_planning'
  }
 }
}
