plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    testmod {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

repositories {
    mavenCentral()
}

neoForge {
    version = project.neo_version

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        testcompanion {
            sourceSet(sourceSets.testmod)
        }
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run-client')
            loadedMods = [mods.getByName(mod_id)]
        }
        server {
            server()
            gameDirectory = project.file('run-production-server')
            loadedMods = [mods.getByName(mod_id)]
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-gametest')
            sourceSet = sourceSets.testmod
            loadedMods = [mods.getByName(mod_id), mods.getByName('testcompanion')]
            // The companion tests deliberately reuse Mojang's tiny empty test structure.
            systemProperty 'neoforge.enabledGameTestNamespaces', 'minecraft,adventureworldgen,testcompanion'
        }
        planningSmokeClient {
            client()
            gameDirectory = project.file('run-planning-smoke')
            sourceSet = sourceSets.testmod
            loadedMods = [mods.getByName(mod_id), mods.getByName('testcompanion')]
            systemProperty 'adventureworldgen.planningSmoke', 'true'
            programArguments.addAll '--quickPlaySingleplayer', 'progress-r8'
        }
        testCompanionServer {
            server()
            gameDirectory = project.file('run-testcompanion-server')
            sourceSet = sourceSets.testmod
            loadedMods = [mods.getByName(mod_id), mods.getByName('testcompanion')]
            programArgument '--nogui'
        }
        data {
            data()
            loadedMods = [mods.getByName(mod_id)]
            programArguments.addAll '--mod', mod_id,
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
    }

    addModdingDependenciesTo sourceSets.testmod
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var properties = [
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_license: mod_license,
        mod_authors: mod_authors,
        mod_description: mod_description
    ]
    inputs.properties properties
    filteringCharset = 'UTF-8'
    expand properties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    // Minecraft already ships this version; also expose it to standalone planner tests.
    implementation 'it.unimi.dsi:fastutil:8.5.12'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

configurations {
    testmodImplementation.extendsFrom implementation
    testmodRuntimeOnly.extendsFrom runtimeOnly
}

// The layering rules in PackageBoundaryTest inspect the source tree. Handing them an absolute root
// derived from the project directory keeps the guard identical whether Gradle runs from this
// directory, from the repository root via -p neoforge, or from anywhere via an absolute -p.
// -PawgSourceRoot=<path> overrides it, which is how a missing tree is shown to fail loudly.
var awgSourceRoot = providers.gradleProperty('awgSourceRoot').getOrElse(
        layout.projectDirectory.dir('src/main/java/io/github/luoyan/adventureworldgen').asFile.absolutePath)

// GameTestInventoryTest reads the registered GameTest surface straight from the test companion
// sources, for the same reason: the inventory must not depend on where Gradle was started.
var awgTestmodSourceRoot = providers.gradleProperty('awgTestmodSourceRoot').getOrElse(
        layout.projectDirectory.dir('src/testmod/java').asFile.absolutePath)

tasks.named('test', Test) {
    // Full-world determinism checks retain multiple uncapped biome plans at once.
    maxHeapSize = '2g'
    useJUnitPlatform()
    systemProperty 'adventureworldgen.sourceRoot', awgSourceRoot
    systemProperty 'adventureworldgen.testmodSourceRoot', awgTestmodSourceRoot
}

// Keep the dedicated-server console interactive for local end-to-end verification.
tasks.named('runServer', JavaExec) {
    standardInput = System.in
}
tasks.named('runTestCompanionServer', JavaExec) {
    standardInput = System.in
}
